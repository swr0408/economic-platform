# ============================================================================
# docker-compose.prod.yml
# ----------------------------------------------------------------------------
# AWS Lightsail (amd64) 本番用 compose ファイル。
#
# docker-compose.oci.yml (ARM64) からの変更点:
#   - platform: linux/amd64 (Lightsail は x86_64)
#   - コンテナ名を econalpha-prod-* に統一
#   - リソース制限を Lightsail プランに合わせて調整
#     (2GB プラン想定。4GB プランなら mem_limit を引き上げ可)
#
# 使い方:
#   cp .env.production.example .env   # 値を埋める
#   docker compose -f docker-compose.prod.yml up -d
#
# Caddy + frontend-prod は port 80/443 が競合するため同時に使わないこと。
# 推奨構成:
#   A) Caddy (API のみ公開) + フロントエンドは Vercel 等の外部ホスト
#   B) frontend-prod (Nginx) のみ使い、Nginx 内で /api/ をプロキシ
# ============================================================================

services:
  # ---------- PostgreSQL + TimescaleDB ----------
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: econalpha-prod-db
    environment:
      POSTGRES_DB: economic_platform
      POSTGRES_USER: postgres
      # :? = 未設定なら起動失敗 (デフォルト 'postgres' での誤起動を防ぐ)
      # ※ 既存ボリュームを初期化済みの場合、変更後は手動で
      #   ALTER USER postgres WITH PASSWORD '<新パスワード>'; が必要
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    networks:
      - econalpha-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d economic_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 現テーブル規模 (最大 economic_calendar_events ~3.2万行) には 512m で十分。
    # 浮いた分を backend (Playwright/Chromium 起動でメモリを食う) へ回す
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

  # ---------- Redis ----------
  # 設計メモ (2026-06-12 監査 M-6):
  #   本アプリは expire=0 (TTLなし) の「永続」キャッシュキーを多用するが、
  #   全キーにファイルキャッシュのフォールバックがあるため、メモリ逼迫時に
  #   allkeys-lru で追い出されても自己回復する (再構築コストのみ発生)。
  #   現在の実使用 ~70MB / 770キーに対し maxmemory 192mb で十分な余裕。
  #   used_memory が 150MB を超えたら maxmemory/mem_limit の引き上げを検討。
  redis:
    image: redis:7-alpine
    container_name: econalpha-prod-redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory 192mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - econalpha-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 256m
    cpus: 0.25
    restart: unless-stopped

  # ---------- Backend (FastAPI + Playwright) ----------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.browser-worker
    container_name: econalpha-prod-backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1 --timeout-graceful-shutdown 30
    working_dir: /app/backend
    environment:
      # :? = 未設定なら起動失敗 (弱いデフォルトでの誤起動を防ぐフェイルセーフ)
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/economic_platform
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # JWT署名鍵 (未設定だとコード内のデフォルト鍵 = トークン偽造可能になるため必須)
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET must be set in .env}
      SEASONALITY_DIR: /app/data/seasonality
      SCREENSHOT_DIR: /app/screenshots
      BROWSER_RUNNER_CONCURRENCY: ${BROWSER_RUNNER_CONCURRENCY:-1}
      PLAYWRIGHT_NO_SANDBOX: "1"
      ALLOWED_ORIGINS_EXTRA: ${ALLOWED_ORIGINS_EXTRA:-}
      # 本番はHTTPS前提のため Secure Cookie をデフォルト有効化
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # 本番ではAPIドキュメント(/docs, /openapi.json)を無効化
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      # 本番では5xxエラー詳細をマスクしログのみに出す
      MASK_ERROR_DETAILS: ${MASK_ERROR_DETAILS:-true}
      # 登録モード: open(誰でも) / invite(招待コード必須=クローズドβ) / closed(停止)
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
      # Pro PDFアーカイブ用 Object Storage (未設定の間はURL発行APIが503を返す)
      LIGHTSAIL_BUCKET_NAME: ${LIGHTSAIL_BUCKET_NAME:-}
      LIGHTSAIL_BUCKET_REGION: ${LIGHTSAIL_BUCKET_REGION:-}
      LIGHTSAIL_ACCESS_KEY_ID: ${LIGHTSAIL_ACCESS_KEY_ID:-}
      LIGHTSAIL_SECRET_ACCESS_KEY: ${LIGHTSAIL_SECRET_ACCESS_KEY:-}
      # API Keys
      FRED_API_KEY: ${FRED_API_KEY:-}
      FMP_API_KEY: ${FMP_API_KEY:-}
      EIA_API_KEY: ${EIA_API_KEY:-}
      BEA_API_KEY: ${BEA_API_KEY:-}
      BLS_API_KEY: ${BLS_API_KEY:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TWITTER_BEARER_TOKEN: ${TWITTER_BEARER_TOKEN:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_FJ_CHANNEL_ID: ${DISCORD_FJ_CHANNEL_ID:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      GOOGLE_CLOUD_VISION_API_KEY: ${GOOGLE_CLOUD_VISION_API_KEY:-}
      ESTAT_API_KEY: ${ESTAT_API_KEY:-}
      DESTATIS_USERNAME: ${DESTATIS_USERNAME:-}
      DESTATIS_PASSWORD: ${DESTATIS_PASSWORD:-}
      TRADING_ECONOMICS_API_KEY: ${TRADING_ECONOMICS_API_KEY:-}
      STOOQ_API_KEY: ${STOOQ_API_KEY:-}
    expose:
      - "8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data:ro
      - screenshots_data:/app/screenshots
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - econalpha-network
    restart: unless-stopped
    # Playwright (Chromium) 起動 + pandas + スレッドプールに 768m は OOM リスク
    # (スクショ取得が OOM kill されると無音失敗 = 取りこぼしの温床)。
    # postgres を 768m→512m に下げた分をこちらへ (2GB ホスト合計 ~1.95GB)。
    # 4GB プランなら 1536m 推奨。
    mem_limit: 1024m
    cpus: 1.0
    shm_size: 256m

  # ---------- Frontend (Nginx) ----------
  # Nginx 同一 VM 構成の場合のみ使う。Vercel 等にデプロイする場合は不要。
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: econalpha-prod-frontend
    # 公開ポートは Caddy のみ。frontend は内部ネットワーク経由で配信する
    # (直接 :80 公開すると認証Cookieが平文HTTPで流れるため廃止 — 監査 H-3)
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - econalpha-network
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25

  # ---------- Caddy (HTTPS リバースプロキシ) ----------
  # 唯一の公開エントリポイント。同一オリジンで SPA(/) と API(/api) を配信し、
  # 自動HTTPS + HSTS を付与する (Caddyfile 参照)。
  caddy:
    image: caddy:2-alpine
    container_name: econalpha-prod-caddy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - econalpha-network
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25

networks:
  econalpha-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  screenshots_data:
  caddy_data:
  caddy_config:
