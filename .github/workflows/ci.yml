name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend-typecheck:
    name: Frontend type check (tsc --noEmit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run type-check

  backend-tests:
    name: Backend pytest (auth / write_guard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          # Install only the subset required for auth / write_guard / openapi tests
          # to keep CI fast and avoid pulling in heavy data-science deps.
          pip install \
            "fastapi==0.109.0" \
            "httpx==0.27.2" \
            "PyJWT==2.8.0" \
            "sqlalchemy==2.0.25" \
            "redis==5.0.1" \
            "pytest==7.4.4" \
            "pytest-asyncio==0.23.3"
      - name: Run auth / write_guard / audit / openapi tests
        run: pytest tests/ -v
