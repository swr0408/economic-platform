services:
  # PostgreSQL + TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: economic-platform-db
    environment:
      POSTGRES_DB: economic_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    networks:
      - economic-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d economic_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: economic-platform-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - economic-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend (FastAPI)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.simple
    container_name: economic-platform-backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app/backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/economic_platform
      REDIS_URL: redis://redis:6379/0
      SEASONALITY_DIR: /app/data/seasonality
      SCREENSHOT_DIR: /app/screenshots
      FRED_API_KEY: ${FRED_API_KEY:-}
      BEA_API_KEY: ${BEA_API_KEY:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TWITTER_BEARER_TOKEN: ${TWITTER_BEARER_TOKEN:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data:ro
      - screenshots_data:/app/screenshots
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - economic-network
    restart: unless-stopped

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.simple
    container_name: economic-platform-celery-worker
    command: celery -A tasks.celery_app worker --loglevel=info -Q economic_data
    working_dir: /app/backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/economic_platform
      REDIS_URL: redis://redis:6379/0
      SCREENSHOT_DIR: /app/screenshots
      FRED_API_KEY: ${FRED_API_KEY:-}
      BEA_API_KEY: ${BEA_API_KEY:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data:ro
      - screenshots_data:/app/screenshots
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - economic-network
    restart: unless-stopped

  # Celery Beat (スケジューラー)
  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile.simple
    container_name: economic-platform-celery-beat
    command: celery -A tasks.celery_app beat --loglevel=info
    working_dir: /app/backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/economic_platform
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data:ro
    depends_on:
      - redis
      - celery-worker
    networks:
      - economic-network
    restart: unless-stopped

  # Celery Flower (モニタリング)
  celery-flower:
    build:
      context: .
      dockerfile: backend/Dockerfile.simple
    container_name: economic-platform-celery-flower
    command: celery -A tasks.celery_app flower --port=5555
    working_dir: /app/backend
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
    networks:
      - economic-network
    restart: unless-stopped

  # Frontend (React + Vite) - 開発用
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: economic-platform-frontend
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - economic-network
    restart: unless-stopped

networks:
  economic-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  screenshots_data:
