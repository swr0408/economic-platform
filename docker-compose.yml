services:
  # PostgreSQL + TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: economic-platform-db
    environment:
      POSTGRES_DB: economic_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    networks:
      - economic-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d economic_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: economic-platform-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - economic-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend (FastAPI)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.simple
    container_name: economic-platform-backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/backend --reload-exclude '*.json' --reload-exclude '*.xlsx' --reload-exclude '*.csv' --reload-exclude 'data/*'
    working_dir: /app/backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/economic_platform
      REDIS_URL: redis://redis:6379/0
      SEASONALITY_DIR: /app/data/seasonality
      SCREENSHOT_DIR: /app/screenshots
      FRED_API_KEY: ${FRED_API_KEY:-}
      EIA_API_KEY: ${EIA_API_KEY:-}
      BEA_API_KEY: ${BEA_API_KEY:-}
      BLS_API_KEY: ${BLS_API_KEY:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TWITTER_BEARER_TOKEN: ${TWITTER_BEARER_TOKEN:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      FMP_API_KEY: ${FMP_API_KEY:-}
      GOOGLE_CLOUD_VISION_API_KEY: ${GOOGLE_CLOUD_VISION_API_KEY:-}
      ESTAT_API_KEY: ${ESTAT_API_KEY:-}
      DESTATIS_USERNAME: ${DESTATIS_USERNAME:-}
      DESTATIS_PASSWORD: ${DESTATIS_PASSWORD:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_FJ_CHANNEL_ID: ${DISCORD_FJ_CHANNEL_ID:-}
      STOOQ_API_KEY: ${STOOQ_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data:ro
      - screenshots_data:/app/screenshots
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - economic-network
    restart: unless-stopped

  # Frontend (React + Vite) - 開発用
  # 使用方法: docker-compose up -d frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: economic-platform-frontend
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - economic-network
    restart: unless-stopped
    profiles:
      - dev

  # Frontend (Nginx) - 本番用
  # 使用方法: docker-compose --profile prod up -d frontend-prod
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: economic-platform-frontend-prod
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - economic-network
    restart: unless-stopped
    profiles:
      - prod

networks:
  economic-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  screenshots_data:
